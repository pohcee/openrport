name: Build MSI packages for Windows
on:
  push:
    tags:
      - "*"

jobs:
  release:
    name: Build MSI packages for Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v2
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.19
      - name: Install WiX Toolset
        # WiX Toolset is no longer preinstalled on GitHub-hosted Windows
        # runner images; msi-build.ps1 expects v3.11 at this exact path.
        run: choco install wixtoolset --version=3.11.2 -y --no-progress
        shell: pwsh
      - name: Creates MSI
        env:
          CS_PFX: ${{ secrets.CS_PFX }}
        run: .github/scripts/msi-build.ps1
      - name: Test MSI
        run: .github/scripts/msi-test.ps1
      - name: Test MSI major upgrade
        run: .github/scripts/msi-test-install-upgrade.ps1
      - name: Publish MSI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSI_UPLOAD_TOKEN: ${{ secrets.MSI_UPLOAD_TOKEN }}
          DOWNLOAD_SERVER: ${{ secrets.DOWNLOAD_SERVER }}
        run: .github/scripts/msi-publish.ps1
# trigger workflow registration
